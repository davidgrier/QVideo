# Run the checks that CI runs, before a commit: `pip install pre-commit ruff`,
# then `pre-commit install` in the checkout.  The hook uses what is installed
# in the environment, so it agrees with what you run by hand.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
