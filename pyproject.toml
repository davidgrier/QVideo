[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "QVideo"
version = "4.8.0"
description = "PyQt-based framework for integrating video cameras into research applications"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "David G. Grier", email = "david.grier@nyu.edu" },
]
keywords = [
    "camera", "video", "imaging", "PyQt5", "PyQt6", "scientific",
    "GenICam", "GigE Vision", "raspberry pi",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy",
    "opencv-python",
    "qtpy",
    "pyqtgraph",
    "psutil",
]

[project.urls]
Homepage = "https://github.com/davidgrier/QVideo"
Repository = "https://github.com/davidgrier/QVideo"
"Bug Tracker" = "https://github.com/davidgrier/QVideo/issues"

[project.optional-dependencies]
pyqt5    = ["PyQt5", "PyQt5-sip"]
pyqt6    = ["PyQt6"]
pyside6  = ["PySide6>=6.7"]
jupyter  = ["ipywidgets"]
opencv   = ["cv2-enumerate-cameras"]
dvr      = ["h5py", "hdf5plugin"]
av       = ["av"]
circletransform = ["scipy"]
# numba is not imported by QVideo: trackpy uses it, and finds features
# about five times faster with it
trackpy  = ["trackpy", "pandas", "numba"]
yolo     = ["ultralytics"]
overlays = ["QVideo[trackpy,yolo]"]
genicam  = ["harvesters", "genicam"]
picamera = ["picamera2"]
test     = ["QVideo[av,circletransform,dvr,jupyter,trackpy]", "pytest", "pytest-cov"]
dev-pyqt5 = ["QVideo[test]", "PyQt5", "PyQt5-sip"]
dev-pyqt6 = ["QVideo[test]", "PyQt6"]
dev-pyside6 = ["QVideo[test]", "PySide6>=6.7"]
dev       = ["QVideo[test,yolo]", "PyQt5", "PyQt5-sip"]
docs     = ["pydata-sphinx-theme", "sphinx", "sphinx-autodoc-typehints", "PyQt5"]

[tool.setuptools]
packages = [
    "QVideo",
    "QVideo.cameras",
    "QVideo.cameras.Basler",
    "QVideo.cameras.Flir",
    "QVideo.cameras.Genicam",
    "QVideo.cameras.IDS",
    "QVideo.cameras.MV",
    "QVideo.cameras.Noise",
    "QVideo.cameras.OpenCV",
    "QVideo.cameras.Picamera",
    "QVideo.cameras.Vimbax",
    "QVideo.demos",
    "QVideo.dvr",
    "QVideo.filters",
    "QVideo.lib",
    "QVideo.overlays",
]

[tool.setuptools.package-data]
'QVideo.dvr' = ['icons/*.svg']

[tool.setuptools.package-dir]
"QVideo"                    = "."
"QVideo.cameras"            = "cameras"
"QVideo.cameras.Basler"     = "cameras/Basler"
"QVideo.cameras.Flir"       = "cameras/Flir"
"QVideo.cameras.Genicam"    = "cameras/Genicam"
"QVideo.cameras.IDS"        = "cameras/IDS"
"QVideo.cameras.MV"         = "cameras/MV"
"QVideo.cameras.Noise"      = "cameras/Noise"
"QVideo.cameras.OpenCV"     = "cameras/OpenCV"
"QVideo.cameras.Picamera"   = "cameras/Picamera"
"QVideo.cameras.Vimbax"     = "cameras/Vimbax"
"QVideo.demos"              = "demos"
"QVideo.dvr"                = "dvr"
"QVideo.filters"            = "filters"
"QVideo.lib"                = "lib"
"QVideo.overlays"           = "overlays"


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["QVideo"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/docs/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "@classmethod",
]
show_missing = true
