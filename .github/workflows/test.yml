name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.qt }}${{ matrix.extras }} / ${{ matrix.os || 'ubuntu-latest' }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    continue-on-error: ${{ matrix.python-version == '3.15' || matrix.qt == 'pyside6' || matrix.os == 'windows-latest' }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      QT_QPA_PLATFORM: offscreen

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        qt: ["pyqt6"]
        os: ["ubuntu-latest"]
        include:
          # Also install the (large) optional YOLO stack in one job.
          - python-version: "3.12"
            qt: "pyqt6"
            extras: ",yolo"
          # PyQt5 on the oldest and newest supported Python.
          - python-version: "3.11"
            qt: "pyqt5"
          - python-version: "3.14"
            qt: "pyqt5"
          # PySide6 is experimental; its failures do not fail the workflow.
          - python-version: "3.12"
            qt: "pyside6"
          # Windows is untested by hand; its failures do not fail the
          # workflow until the platform is known to be sound.
          - python-version: "3.12"
            qt: "pyqt6"
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libgl1 \
            libegl1 \
            libglib2.0-0 \
            libxkbcommon0

      - name: Install package and test dependencies
        run: pip install -e ".[dev-${{ matrix.qt }}${{ matrix.extras }}]"

      - name: Run tests
        run: python -m pytest --tb=short -q
