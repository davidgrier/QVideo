[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "QVideo"
version = "4.28.0"
description = "PyQt-based framework for integrating video cameras into research applications"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "David G. Grier", email = "david.grier@nyu.edu" },
]
keywords = [
    "camera", "video", "imaging", "PyQt5", "PyQt6", "scientific",
    "GenICam", "GigE Vision", "raspberry pi",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy",
    "opencv-python",
    "qtpy",
    "pyqtgraph",
    "psutil",
]

[project.urls]
Homepage = "https://github.com/davidgrier/QVideo"
Repository = "https://github.com/davidgrier/QVideo"
"Bug Tracker" = "https://github.com/davidgrier/QVideo/issues"

[project.optional-dependencies]
pyqt5    = ["PyQt5", "PyQt5-sip"]
pyqt6    = ["PyQt6"]
pyside6  = ["PySide6>=6.7"]
jupyter  = ["ipywidgets"]
opencv   = ["cv2-enumerate-cameras"]
dvr      = ["h5py", "hdf5plugin"]
av       = ["av"]
circletransform = ["dgimage>=0.2.0"]
# numba is not imported by QVideo: trackpy uses it, and finds features
# about five times faster with it
trackpy  = ["trackpy", "pandas", "numba"]
yolo     = ["pandas"]
overlays = ["QVideo[trackpy,yolo]"]
# viva-genicam publishes wheels for these platforms only; elsewhere (a
# Raspberry Pi, an Intel Mac) pip would have to build it from source with a
# Rust toolchain, so the genicam extra skips it there.
genicam  = [
    "viva-genicam; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
    "harvesters",
    "genicam",
]
viva     = ["viva-genicam"]
picamera = ["picamera2"]
stream   = ["aiohttp", "segno"]
test     = ["QVideo[av,circletransform,dvr,jupyter,stream,trackpy,viva]", "pytest", "pytest-cov"]
dev-pyqt5 = ["QVideo[test]", "PyQt5", "PyQt5-sip"]
dev-pyqt6 = ["QVideo[test]", "PyQt6"]
dev-pyside6 = ["QVideo[test]", "PySide6>=6.7"]
dev       = ["QVideo[test,yolo]", "PyQt5", "PyQt5-sip"]
docs     = ["pydata-sphinx-theme", "sphinx", "sphinx-autodoc-typehints", "PyQt5", "aiohttp", "segno"]

[tool.setuptools]
packages = [
    "QVideo",
    "QVideo.cameras",
    "QVideo.cameras.Basler",
    "QVideo.cameras.Flir",
    "QVideo.cameras.Genicam",
    "QVideo.cameras.IDS",
    "QVideo.cameras.MV",
    "QVideo.cameras.Noise",
    "QVideo.cameras.OpenCV",
    "QVideo.cameras.Picamera",
    "QVideo.cameras.Vimbax",
    "QVideo.cameras.Viva",
    "QVideo.demos",
    "QVideo.dvr",
    "QVideo.filters",
    "QVideo.interactive",
    "QVideo.lib",
    "QVideo.lib.remote",
    "QVideo.overlays",
    "QVideo.widgets",
]

[tool.setuptools.package-data]
'QVideo.dvr' = ['icons/*.svg']

[tool.setuptools.package-dir]
"QVideo"                    = "."
"QVideo.cameras"            = "cameras"
"QVideo.cameras.Basler"     = "cameras/Basler"
"QVideo.cameras.Flir"       = "cameras/Flir"
"QVideo.cameras.Genicam"    = "cameras/Genicam"
"QVideo.cameras.IDS"        = "cameras/IDS"
"QVideo.cameras.MV"         = "cameras/MV"
"QVideo.cameras.Noise"      = "cameras/Noise"
"QVideo.cameras.OpenCV"     = "cameras/OpenCV"
"QVideo.cameras.Picamera"   = "cameras/Picamera"
"QVideo.cameras.Vimbax"     = "cameras/Vimbax"
"QVideo.cameras.Viva"       = "cameras/Viva"
"QVideo.demos"              = "demos"
"QVideo.dvr"                = "dvr"
"QVideo.filters"            = "filters"
"QVideo.interactive"        = "interactive"
"QVideo.lib"                = "lib"
"QVideo.overlays"           = "overlays"
"QVideo.widgets"            = "widgets"


[tool.ruff]
line-length = 79
extend-exclude = ["devel"]

[tool.ruff.lint]
# F pyflakes, B bugbear, E501 line length, Q quotes, SIM simplifications
# (except SIM905), PERF performance, PIE misc, RUF012 mutable class
# attributes, RUF100 stale noqa, UP037 quoted annotations; E402 imports at
# the top, E731 lambda assigned, E741 ambiguous name, RUF015 first element,
# RUF059 unused unpacked variable, PLW0108 needless lambda, PLW1510
# subprocess without check, TID252 a relative import of a parent (a sibling
# is imported as `.name`), A001 and A002 a name that hides a builtin, C400
# and C401 a generator that is a comprehension, PLW2901 a loop variable that
# is overwritten.
select = ["F", "B", "E402", "E501", "E731", "E741", "Q", "SIM", "PERF",
          "PIE", "PLW0108", "PLW1510", "PLW2901", "RUF012", "RUF015",
          "RUF059", "RUF100", "TID252", "UP037", "A001", "A002", "C400",
          "C401"]
ignore = ["SIM905"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "single"
docstring-quotes = "single"

[tool.ruff.lint.per-file-ignores]
# Package files re-export names; tests build stubs and mocks.
"__init__.py" = ["F401"]
# Sphinx reads the name `copyright`.
"docs/conf.py" = ["A001", "E402"]
# Tests import after patching, unpack to name what they do not use, keep a
# temporary file open across a test, and are not held to the style rules
# that simplify code (a lambda in a test is often late binding on purpose,
# and a test runs a child process without a check).
"tests/*" = ["E402", "E501", "F401", "F811", "F841", "B018", "B905",
             "RUF012", "RUF059", "SIM", "PERF", "PIE", "PLW2901",
             "UP037", "PLW0108", "PLW1510", "E731", "RUF015", "A002"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
# Type checking of lib/, the best-typed part, as an allowed-to-fail job in
# CI.  Run it in an environment with PyQt6 and no other Qt binding, as CI
# does: with PyQt5 beside it, pyright reads the stubs of PyQt5.  qtpy does
# not declare Slot and Signal as exports of its modules, which pyright
# reports and which says nothing about our code (reportPrivateImportUsage).
# The Qt stubs type the arguments of event handlers as Optional, so every
# override of closeEvent, resizeEvent, mousePressEvent and the like would
# be reported (reportIncompatibleMethodOverride).
include = ["lib"]
pythonVersion = "3.11"
extraPaths = [".."]
reportPrivateImportUsage = "none"
reportIncompatibleMethodOverride = "none"

[tool.coverage.run]
source = ["QVideo"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/docs/*",
]

[tool.coverage.report]
# A floor under the measured 96%, to make a regression visible.  CI checks
# it in one job (Python 3.12, PyQt6, with the YOLO extras); the other jobs
# do not measure coverage.
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "@classmethod",
]
show_missing = true
